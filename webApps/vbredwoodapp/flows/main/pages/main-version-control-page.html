<oj-sp-general-overview-page
  id="versionControlPage"
  display-options.responsive-padding="on"
  display-options.navigator="off"
  display-mode="mixed"
  page-title="Version Control"
  page-subtitle="Browse object versions, diffs and tags">

  <div slot="main">

    <!-- Storage provider tabs -->
    <div class="fmt-card oj-sm-padding-4x oj-sm-margin-4x-bottom">
      <oj-tab-bar
        id="storageTabBar"
        selection="{{ $variables.activeStorageTab }}"
        on-selection-changed="[[$listeners.storageTabChanged]]"
        display="standard"
        edge="top">
        <ul>
          <li id="git-tab"><a href="#"><span slot="startIcon" class="oj-ux-ico-repository"></span>Git</a></li>
          <li id="oci-tab"><a href="#"><span slot="startIcon" class="oj-ux-ico-cloud"></span>OCI Object Storage</a></li>
        </ul>
      </oj-tab-bar>

      <div class="oj-sm-padding-4x-top">
        <oj-bind-if test="[[$variables.activeStorageTab === 'git-tab']]">
          <div class="oj-flex" style="gap:var(--oj-spacing-3x);">
            <oj-c-input-text
              label-hint="Repository URL"
              value="[[$variables.gitConfig.repoUrl]]"
              readonly="true"
              class="oj-flex-item">
            </oj-c-input-text>
            <oj-c-input-text
              label-hint="Branch"
              value="[[$variables.gitConfig.branch]]"
              readonly="true"
              class="oj-flex-item"
              style="max-width:200px;">
            </oj-c-input-text>
          </div>
        </oj-bind-if>
        <oj-bind-if test="[[$variables.activeStorageTab === 'oci-tab']]">
          <div class="oj-flex" style="gap:var(--oj-spacing-3x);">
            <oj-c-input-text
              label-hint="OCI Bucket"
              value="[[$variables.ociConfig.bucket]]"
              readonly="true"
              class="oj-flex-item">
            </oj-c-input-text>
            <oj-c-input-text
              label-hint="Region"
              value="[[$variables.ociConfig.region]]"
              readonly="true"
              class="oj-flex-item"
              style="max-width:200px;">
            </oj-c-input-text>
          </div>
        </oj-bind-if>
      </div>
    </div>

    <!-- Version browser -->
    <div class="fmt-card oj-sm-padding-4x oj-sm-margin-4x-bottom">
      <div class="oj-flex oj-sm-align-items-center oj-sm-justify-content-between oj-sm-padding-3x-bottom">
        <span class="oj-typography-heading-sm">Versions</span>
        <div class="oj-flex" style="gap:var(--oj-spacing-2x);">
          <oj-c-input-text
            label-hint="Filter versions"
            value="{{ $variables.versionFilter }}"
            style="min-width:200px;"
            on-value-changed="[[$listeners.filterVersions]]">
          </oj-c-input-text>
          <oj-button chroming="outlined" id="createTagBtn" on-oj-action="[[$listeners.openTagManager]]">
            <span slot="startIcon" class="oj-ux-ico-tag"></span>
            <span>Tags</span>
          </oj-button>
        </div>
      </div>
      <oj-table
        id="versionsTable"
        data="[[$variables.versionsADP]]"
        columns='[
          {"headerText":"Version / Commit","field":"ref","sortable":"enabled"},
          {"headerText":"Environment","field":"environment","sortable":"enabled","width":"140px"},
          {"headerText":"Objects","field":"objectCount","width":"80px"},
          {"headerText":"Author","field":"author","width":"140px"},
          {"headerText":"Date","field":"date","sortable":"enabled","width":"140px"},
          {"headerText":"Tags","field":"tags","template":"tagsCell"},
          {"headerText":"","field":"_actions","template":"versionActionsCell","width":"90px","sortable":"disabled"}
        ]'
        scroll-policy="loadMoreOnScroll">
        <template slot="tagsCell">
          <oj-bind-for-each data="[[$current.row.tags]]">
            <template>
              <oj-tag severity="neutral" style="margin-right:var(--oj-spacing-1x);">
                <span><oj-bind-text value="[[$current.data]]"></oj-bind-text></span>
              </oj-tag>
            </template>
          </oj-bind-for-each>
        </template>
        <template slot="versionActionsCell">
          <div class="oj-flex" style="gap:var(--oj-spacing-1x);">
            <oj-button display="icons" chroming="borderless" on-oj-action="[[$listeners.viewDiff]]" data-ref="[[$current.row.ref]]">
              <span slot="startIcon" class="oj-ux-ico-diff"></span>
              <span>Diff</span>
            </oj-button>
            <oj-button display="icons" chroming="borderless" on-oj-action="[[$listeners.restoreVersion]]" data-ref="[[$current.row.ref]]">
              <span slot="startIcon" class="oj-ux-ico-restore"></span>
              <span>Restore</span>
            </oj-button>
          </div>
        </template>
        <template slot="noData">
          <oj-bind-if test="[[$variables.isLoading]]">
            <div class="oj-sm-padding-4x">
              <oj-c-skeleton height="40px" class="oj-sm-margin-2x-bottom"></oj-c-skeleton>
              <oj-c-skeleton height="40px"></oj-c-skeleton>
            </div>
          </oj-bind-if>
          <oj-bind-if test="[[!$variables.isLoading]]">
            <oj-illustration-message title="No versions found" description="Run a migration to create the first version snapshot."></oj-illustration-message>
          </oj-bind-if>
        </template>
      </oj-table>
    </div>

    <!-- Diff viewer side drawer -->
    <oj-drawer-popup
      id="diffDrawer"
      opened="{{ $variables.diffDrawerOpen }}"
      edge="end"
      modality="modeless"
      on-oj-dismiss="[[$listeners.closeDiffDrawer]]">
      <div style="width:50vw; min-width:400px; padding:var(--oj-spacing-4x); overflow-y:auto; height:100%;">
        <div class="oj-flex oj-sm-align-items-center oj-sm-justify-content-between oj-sm-padding-3x-bottom">
          <span class="oj-typography-heading-sm">Version Diff: <oj-bind-text value="[[$variables.diffRef]]"></oj-bind-text></span>
          <oj-button display="icons" chroming="borderless" on-oj-action="[[$listeners.closeDiffDrawer]]">
            <span slot="startIcon" class="oj-ux-ico-cross"></span>
            <span>Close</span>
          </oj-button>
        </div>
        <div class="fmt-log-viewer oj-sm-padding-3x" style="height:calc(100vh - 180px); overflow-y:auto; background:var(--oj-core-bg-color-neutral); border-radius:var(--oj-border-radius-md); font-family:monospace; font-size:0.8125rem; white-space:pre-wrap;">
          <oj-bind-text value="[[$variables.diffContent]]"></oj-bind-text>
        </div>
      </div>
    </oj-drawer-popup>

    <!-- Tag Manager Panel -->
    <oj-dialog id="tagManagerDialog" title="Tag Manager" style="width:600px;">
      <div slot="body">
        <div class="oj-sm-padding-3x-bottom">
          <div class="oj-flex" style="gap:var(--oj-spacing-2x);">
            <oj-c-input-text
              label-hint="New tag name"
              value="{{ $variables.newTagName }}"
              class="oj-flex-item">
            </oj-c-input-text>
            <oj-c-select-single
              label-hint="Version"
              value="{{ $variables.newTagRef }}"
              data="[[$variables.versionsADP]]"
              item-text="ref"
              style="min-width:200px;">
            </oj-c-select-single>
            <oj-button chroming="callToAction" on-oj-action="[[$listeners.createTag]]">
              <span>Create</span>
            </oj-button>
          </div>
        </div>
        <oj-table
          data="[[$variables.tagsADP]]"
          columns='[
            {"headerText":"Tag","field":"name"},
            {"headerText":"Version","field":"ref","width":"200px"},
            {"headerText":"Created","field":"date","width":"140px"},
            {"headerText":"","field":"_del","template":"deleteTagCell","width":"60px","sortable":"disabled"}
          ]'>
          <template slot="deleteTagCell">
            <oj-button display="icons" chroming="borderless" on-oj-action="[[$listeners.deleteTag]]" data-tag="[[$current.row.name]]">
              <span slot="startIcon" class="oj-ux-ico-trash"></span>
              <span>Delete</span>
            </oj-button>
          </template>
          <template slot="noData">
            <oj-illustration-message title="No tags" description="Create a tag to mark an important version."></oj-illustration-message>
          </template>
        </oj-table>
      </div>
      <div slot="footer">
        <oj-button chroming="outlined" on-oj-action="[[$listeners.closeTagManager]]"><span>Close</span></oj-button>
      </div>
    </oj-dialog>

  </div>
</oj-sp-general-overview-page>
