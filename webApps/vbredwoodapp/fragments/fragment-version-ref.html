<!-- fragment-version-ref: Inline chip showing a version reference (commit SHA, tag, etc.). -->

<span class="fmt-version-ref oj-typography-body-2xs" style="font-family:monospace; background:var(--oj-core-bg-color-neutral); padding:2px var(--oj-spacing-2x); border-radius:var(--oj-border-radius-sm);">
  <oj-bind-text value="[[$variables.ref]]"></oj-bind-text>
</span>
