<oj-vb-fragment id="page-header" bridge="[[vbBridge]]" name="page-header">
  <oj-vb-fragment-param name="title" value=""></oj-vb-fragment-param>
</oj-vb-fragment>
<oj-sp-welcome-page id="oj-sp-wp1" illustration-background="[[ require.toUrl($page.variables.illustrationBackground) ]]"
  illustration-foreground="[[ require.toUrl($page.variables.illustrationForeground) ]]"
  display-options.image-stretch="[[ $page.variables.imageStretch ]]"
  display-options.mobile-image="[[ $page.variables.mobileImage ]]" display-options.responsive-padding="on"
  page-title="Equipment Dashboard" background-color="dark-pebble">
  <div class="oj-flex oj-flex-item oj-md-margin-8x-start oj-md-margin-8x-end sample-box ">
    <div class="oj-flex oj-flex-item oj-sm-flex-direction-column sample-box2" style="overflow-x: auto">
      <div class="oj-flex oj-sm-flex-direction-column oj-sm-flex-initial">
        <!-- <span class="oj-ux-ico-reject-category"></span> -->

        <div class="oj-flex fold-panels-parent" id="fold-panels-parent">

          <!-- show 4 boxes in line on lg (oj-lg-3); show two per row on smaller sizes (oj-sm-6 oj-md-6)  -->
          <div
            class="oj-flex-item oj-flex oj-sm-6 oj-md-6 oj-lg-3 oj-sm-padding-1x-horizontal fold-panel fold-panel1 fold-closed"
            :style.min-height="[[ $application.responsive.lgUp ? '200px' : '130px' ]]" id="box1-enclosing">
            <!-- style the content with shadow, rounded border and hover animation -->
            <div class="oj-flex-item oj-flex oj-sm-flex-items-initial box-shadow box1" id="box1-shadow">
              <!-- share space (oj-md-8) with icon on md; take whole width on sm (oj-sm-12) -->
              <div class="oj-flex-item oj-flex oj-sm-12 oj-md-8 oj-sm-padding-4x" id="box1-left-text">
                <!-- on sm center text; otherwise left aligned -->
                <div class="oj-flex-item oj-flex oj-sm-12 oj-sm-only-justify-content-center" id="box1-text1">
                  <!-- <span class="oj-typography-heading-lg">24</span> -->
                  <oj-highlight-text class="oj-typography-heading-lg"
                    text="[[ $application.variables.dashboardAdp.data[0].equipment_count ]]"></oj-highlight-text>
                </div>
                <div class="oj-flex-item oj-flex oj-sm-12 oj-sm-only-justify-content-center" id="box1-text2">
                  <span class="oj-typography-body-md">Project Total Equipment</span>
                </div>
              </div>
              <!-- share space (oj-md-4) with text on md; hide icon on sm (oj-sm-only-hide) -->
              <div class="oj-flex-item oj-md-4 icon-style icon1 oj-sm-only-hide"
                :style.font-size="[[ $application.variables.navMenuVisible && $page.functions.getCustomMediaQuery() ? '3rem' : '4.5rem' ]]"
                id="box1-icon">
                <i :class="[['oj-ux-ico-equipment']]"></i>
              </div>
              <!-- style box to align to the bottom with rounded border and colors  -->
              <div class="oj-flex-item oj-flex oj-sm-padding-2x oj-sm-12 box1-inner hand" id="box1-bottom-text">

          More Info &nbsp
          <i :class="[['oj-typography-heading-xs oj-ux-ico-arrow-circle-right']]"></i>
        </span> -->
              </div>
            </div>
          </div>

          <div

              </div>
              <div class="oj-flex-item oj-flex oj-sm-padding-2x oj-sm-12 box3-inner hand"

                <!-- <span class="oj-flex-item oj-flex oj-sm-justify-content-center oj-typography-subheading-xs">

              </div>
            </div>
          </div>



          <div
            class="oj-flex-item oj-flex oj-sm-6 oj-md-6 oj-lg-3 oj-sm-padding-1x-horizontal oj-sm-only-padding-2x-top oj-md-only-padding-2x-top fold-panel fold-panel4 fold-closed"

            <div class="oj-flex-item oj-flex oj-sm-flex-items-initial box-shadow box4">
              <div class="oj-flex-item oj-flex oj-sm-12 oj-md-8 oj-sm-padding-4x">
                <div class="oj-flex-item oj-flex oj-sm-12 oj-sm-only-justify-content-center">
                  <!-- <span class="oj-typography-heading-lg"></span> -->
                  <oj-highlight-text class="oj-typography-heading-lg"

                <div class="oj-flex-item oj-flex oj-sm-12 oj-sm-only-justify-content-center">
                  <span class="oj-typography-body-md"> Project Equipment Demobilized</span>

              </div>
              <div class="oj-flex-item oj-md-4 icon-style icon4 oj-sm-only-hide"
                :style.font-size="[[ $application.variables.navMenuVisible && $page.functions.getCustomMediaQuery() ? '3rem' : '4.5rem' ]]">
                <i :class="[['oj-ux-ico-reject-category']]"></i>
              </div>
              <div class="oj-flex-item oj-flex oj-sm-padding-2x oj-sm-12 box4-inner hand"
                >
                <!-- <span class="oj-flex-item oj-flex oj-sm-justify-content-center oj-typography-subheading-xs">
          More Info &nbsp
          <i :class="[['oj-typography-heading-xs oj-ux-ico-arrow-circle-right']]"></i>
        </span> -->
              </div>
            </div>
          </div>
        </div>
