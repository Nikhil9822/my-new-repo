<oj-vb-fragment id="page-header" bridge="[[vbBridge]]" name="page-header">
  <!-- <oj-vb-fragment-param name="title" value="Analytics"></oj-vb-fragment-param>
  <template slot="actions">
  </template> -->
</oj-vb-fragment>

<oj-sp-welcome-page id="oj-sp-wp1" illustration-background="[[ require.toUrl($page.variables.illustrationBackground) ]]"
  illustration-foreground="[[ require.toUrl($page.variables.illustrationForeground) ]]"
  display-options.responsive-padding="on" page-title="Analytics" background-color="dark-pebble">
  <div style="margin-top:-47px">
    <div class="oj-flex oj-panel" style="min-height:85vh">
       <div class="oj-flex-item oj-md-12 oj-sm-12" style="max-height:90vh;box-shadow:5px 5px 5px #f1f1f1">
        <oj-validation-group id="searchgroup">
          <oj-form-layout columns="5" max-columns="5" label-edge="top">
            <oj-select-single label-hint="Report" style="width:22vw" value="{{ $variables.searchObj.report }}"
              data="[[ $variables.reportADP ]]"></oj-select-single>
              <oj-bind-if test="[[$variables.searchObj.report!=='Equipment Utilization Report']]">
               
           
            <oj-select-single label-hint="Equipment Resource Class" style="width:22vw"
              value="{{ $variables.searchObj.class }}" item-text="eqp_class_details"
              data="[[$variables.getGetEquipmentClassesListSDP]]"></oj-select-single>
            <oj-select-single label-hint="Equipment Name" style="width:22vw"
              value="{{ $variables.searchObj.eqpNameNumber }}" item-text="eqp_class_names"
              data="[[$variables.getEQPRiteClassEqpNamesListSDP]]"
              on-value-item-changed="[[$listeners.selectValueItem]]"></oj-select-single>
            <oj-input-date label-hint="From Date" converter='{"type": "datetime", "options": {"pattern":"dd-MMM-yyyy"}}'
              value="{{ $variables.searchObj.from_date }}">
              <!-- required="[[ $variables.searchObj.report === 'Equipment Utilization Report' ? true : false ]]" -->
              
            </oj-input-date>
            <oj-input-date label-hint="To Date" value="{{ $variables.searchObj.to_date }}" 

             converter='{"type": "datetime", "options": {"pattern":"dd-MMM-yyyy"}}'></oj-input-date>
              <!-- required="[[ $variables.searchObj.report === 'Equipment Utilization Report' ? true : false ]]" -->
             
       
       </oj-bind-if>
          </oj-form-layout>
        </oj-validation-group>

        <oj-toolbar chroming="solid">
          <oj-button label="Search" chroming="callToAction" on-oj-action="[[$listeners.buttonAction]]"
            class="oj-button-sm">
          </oj-button>
          <oj-button label="Reset" chroming="callToAction" on-oj-action="[[$listeners.buttonAction2]]"
            class="oj-button-sm">
          </oj-button>
          <oj-bind-if test="[[ $variables.EquipmentTblADP.data.length > 0 ]]">
            <oj-button label="Export" chroming="callToAction" on-oj-action="[[$listeners.buttonAction3]]"
              class="oj-button-sm"></oj-button>
          </oj-bind-if>
         <oj-bind-if test="[[$variables.searchObj.report=='Equipment Utilization Report']]">
            <span>
              <oj-bind-text value="Hours"></oj-bind-text>
              <oj-switch label-hint="" style="vertical-align:middle" on-value-changed="[[$listeners.switchValue]]"></oj-switch>
              <oj-bind-text value="Days"></oj-bind-text>
            </span>          
          </oj-bind-if>


        </oj-toolbar>

       </div>


    
       
        <oj-bind-if test="[[$variables.searchObj.report!=='Equipment Utilization Report']]">
            <div class="oj-flex-item oj-md-9 oj-sm-9" style="max-height:90vh;box-shadow:5px 5px 5px #f1f1f1">

          <oj-table scroll-policy="loadMoreOnScroll" data="[[ $variables.EquipmentTblADP ]]" display="grid"
            style="width:100%;height:70vh" columns='{{$variables.columns}}'   columns-default.resizable="enabled">

            <template slot="date">
              <oj-input-date aria-label="Date" value="[[$current.data]]"
                converter='{"type": "datetime", "options": {"pattern":"dd-MM-yyyy"}}' readonly="true"></oj-input-date>
            </template>
          </oj-table>
            </div>
            <div class="oj-flex-item oj-sm-flex-initial  oj-md-3 oj-sm-2"
        style="max-height:90vh;background-color:#faf9f9;box-shadow:5px 5px 5px #f1f1f1">
        <oj-chart type="pie" class="oj-sm-flex-initial" style="height:35vh" animation-on-display="auto"
          style-defaults.three-d-effect="on" data="[[ $variables.ChartADP ]]">
          <template slot='itemTemplate' data-oj-as='item'>
            <oj-chart-item value='[[item.data.value]]' group-id='[[[item.data.group] ]]'
              series-id='[[item.data.series]]'>
            </oj-chart-item>
          </template>
        </oj-chart>
        <demo-chart-three-d-effect-control id="threeDControl" three-d-effect="on" aria-controls="pieChart">
        </demo-chart-three-d-effect-control>

        <oj-chart type="bar" class="oj-sm-flex-initial" style="height:35vh" animation-on-display="auto"
          style-defaults.three-d-effect="on" data="[[ $variables.ChartADP ]]">
          <template slot='itemTemplate' data-oj-as='item'>
            <oj-chart-item value='[[item.data.value]]' group-id='[[[item.data.group] ]]'
              series-id='[[item.data.series]]'>
            </oj-chart-item>
          </template>
        </oj-chart>
        <demo-chart-three-d-effect-control id="threeDControl" three-d-effect="on" aria-controls="pieChart">
        </demo-chart-three-d-effect-control>
        </oj-chart>

      </div>
        </oj-bind-if>
        <oj-bind-if test="[[$variables.searchObj.report==='Equipment Utilization Report' && $variables.isRowExist]]">
           <div class="oj-flex-item oj-md-9 oj-sm-9" style="max-height:90vh;box-shadow:5px 5px 5px #f1f1f1">
           <oj-table scroll-policy="loadMoreOnScroll" id="oj-table-175486407-2" class="oj-table-stretch oj-flex-item"
            data="[[ $variables.treeDP ]]" columns="[[ $variables.dynamicCols ]]" style="height:700px;width:100%"
            :style.min-width="[[ $application.responsive.smOnly ? '300px' : '600px' ]]"
            scroll-policy-options.max-count="200"   columns-default.resizable="enabled"
            on-first-selected-row-changed="[[$listeners.ojTable1754864072FirstSelectedRow]]"
            selection-mode.row="single">

            <template slot="treeCellTemplate" data-oj-as="cell">
              <td>
                <oj-row-expander context="[[cell]]"></oj-row-expander>
                <oj-bind-text value="[[cell.data]]"></oj-bind-text>
              </td>
            </template>

            <template slot="cellTemplate" data-oj-as="cell">
              <td>
                <oj-bind-text value="[[cell.data]]"></oj-bind-text>
              </td>
            </template>

          </oj-table>
           </div>
           <div class="oj-flex-item oj-md-3 oj-sm-3">

             <oj-chart type="pie" class="oj-sm-flex-initial" style="height:35vh" animation-on-display="auto"
          style-defaults.three-d-effect="on" data="[[ $variables.utilsChartADP ]]">
          <template slot='itemTemplate' data-oj-as='item'>
            <oj-chart-item value='[[item.data.value]]' group-id='[[[item.data.group] ]]'
              series-id='[[item.data.series]]'>
            </oj-chart-item>
          </template>
        </oj-chart>
        <demo-chart-three-d-effect-control id="threeDControl1" three-d-effect="on" aria-controls="pieChart">
        </demo-chart-three-d-effect-control>


        <oj-chart type="bar" class="oj-sm-flex-initial" style="height:35vh" animation-on-display="auto"
          style-defaults.three-d-effect="on" data="[[ $variables.utilsChartADP ]]">
          <template slot='itemTemplate' data-oj-as='item'>
            <oj-chart-item value='[[item.data.value]]' group-id='[[[item.data.group] ]]'
              series-id='[[item.data.series]]'>
            </oj-chart-item>
          </template>
        </oj-chart>
        <demo-chart-three-d-effect-control id="threeDControl" three-d-effect="on" aria-controls="pieChart">
        </demo-chart-three-d-effect-control>
        </oj-chart>

           </div>


        </oj-bind-if>




      </div>

      




    </div>
  </div>
</oj-sp-welcome-page>
